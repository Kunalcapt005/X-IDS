services:
  postgres:
    image: postgres:17-alpine
    container_name: xids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xids}
      POSTGRES_USER: ${POSTGRES_USER:-xids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xids} -d ${POSTGRES_DB:-xids}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: xids-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xids}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-xids}
      ML_ARTIFACT_DIR: /app/ml/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app/ml:ro

volumes:
  postgres_data:
