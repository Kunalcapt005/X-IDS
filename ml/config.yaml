paths:
  train_csv: data/raw/UNSW_NB15_training-set.csv
  test_csv: data/raw/UNSW_NB15_testing-set.csv
  artifact_dir: artifacts
  report_dir: reports

columns:
  target: attack_cat
  binary_label: label
  drop:
    - id
    - attack_cat
    - label

  categorical:
    - proto
    - service
    - state

training:
  validation_size: 0.20
  random_state: 42
  rare_classes:
    - Backdoors
    - Exploits
    - Worms

models:
  logistic_regression:
    max_iter: 2000
    C: 1.0
  random_forest:
    n_estimators: 350
    random_state: 42
    n_jobs: -1
    class_weight: balanced
  xgboost:
    n_estimators: 400
    max_depth: 8
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.9
    objective: multi:softprob
    eval_metric: mlogloss
    random_state: 42
    n_jobs: -1

imbalance:
  strategies:
    - baseline
    - class_weight
    - smote
    - undersampling

selection:
  primary_metric: macro_f1
  tiebreak_metric: rare_class_recall
